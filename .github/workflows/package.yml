name: package

# The container image on GitHub Packages (X-package): ghcr.io/<owner>/paramesh. A tag v1.2.3 pushes
# 1.2.3 and latest; a manual run pushes latest; a pull request that changes the image only builds
# and tests it. The image is tested before it is pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [Dockerfile, .dockerignore, tools/setup/**, .github/workflows/package.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build
        run: docker build -t paramesh:test .
      - name: Test the tools and the library
        run: |
          docker run --rm paramesh:test pmd --help
          docker run --rm paramesh:test bash -c 'command -v pm pmrun'
          docker run --rm paramesh:test bash -c 'printf "#include <paramesh.h>\nint main(void){return pm_strerror(PM_OK)==0;}\n" >/tmp/a.c && cc -O2 /tmp/a.c $(pkg-config --cflags --libs paramesh) -o /tmp/a && /tmp/a'
      - name: Test the services and a one-node job
        run: |
          docker run -d --name pm --network host --init --security-opt seccomp=unconfined paramesh:test
          for port in 47002 47080; do
            for _ in $(seq 1 50); do (: </dev/tcp/127.0.0.1/$port) 2>/dev/null && break; sleep 0.2; done
            (: </dev/tcp/127.0.0.1/$port) || { docker logs pm; exit 1; }
          done
          curl -sf -X POST -H 'X-ParaMesh: 1' -d '{"cap_cores": 2, "cap_ram": 1073741824}' http://127.0.0.1:47002/v1/join
          sleep 2
          docker exec pm pm status
          docker exec pm pmrun -n 1 /opt/paramesh/apps/quickstart 100000 || { docker logs pm; exit 1; }
          docker rm -f pm
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paramesh"
          tags=(latest "sha-${GITHUB_SHA::7}")
          [[ "$GITHUB_REF" == refs/tags/v* ]] && tags+=("${GITHUB_REF_NAME#v}")
          for tag in "${tags[@]}"; do
            docker tag paramesh:test "$image:$tag"
            docker push "$image:$tag"
          done
