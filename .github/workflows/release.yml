name: release

# A tag v1.2.3 publishes one installer, built here on the oldest Ubuntu ParaMesh supports, so that
# it runs on that and anything newer. Every laptop then installs the same bytes, as jobs require.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build the installer
        run: tools/setup/package.sh dist
      - name: Name it for the latest link
        run: |
          mv dist/paramesh-setup-*.sh dist/paramesh-setup.sh
          (cd dist && sha256sum paramesh-setup.sh >paramesh-setup.sh.sha256)
          cp tools/setup/get.sh dist/install.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          dist/paramesh-setup.sh dist/paramesh-setup.sh.sha256 dist/install.sh
