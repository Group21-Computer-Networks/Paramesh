name: ci

on:
  push:
  pull_request:
    # "edited" re-runs the log check when a PR title is fixed; the build jobs skip that event.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event.action != 'edited'
    name: ${{ matrix.compiler }} / ${{ matrix.sanitizer || 'no sanitizer' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: ["", address, undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPARAMESH_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  format:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format
      - name: clang-format
        run: |
          git ls-files -- '*.c' '*.h' '*.cpp' '*.hpp' ':!:third_party/**' \
            | xargs --no-run-if-empty clang-format --dry-run --Werror

  tidy:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang clang-tidy
      - name: Configure
        run: cmake --preset tidy
      - name: Build with clang-tidy
        run: cmake --build --preset tidy

  implementation-logs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check docs/logs
        # The PR title goes through an environment variable, never straight into the shell line.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 .claude/skills/paramesh-plan/scripts/plan.py check --base "origin/$BASE_REF" --pr-title "$PR_TITLE"
          else
            python3 .claude/skills/paramesh-plan/scripts/plan.py check
          fi
